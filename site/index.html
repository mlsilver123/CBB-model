<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CBB Model">
<meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151514" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23c2541a'/%3E%3Cpath d='M4 50h92M50 4v92M18 18c18 18 18 46 0 64M82 18c-18 18-18 46 0 64' stroke='%23fff' stroke-width='5' fill='none'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon.png">
<title>CBB Model</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --ink:#1d1d1b; --muted:#6b6b66; --line:#e3e2dd;
          --accent:#1f5fae; --win:#1e7a46; --loss:#b3261e; --strong:#1f5fae; --medium:#5d8fd0; --lean:#a9c4e8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151514; --card:#1f1f1d; --ink:#ecebe6; --muted:#9b9a94; --line:#33332f;
            --accent:#7fb0ef; --win:#5cc28a; --loss:#ef7d74; --strong:#7fb0ef; --medium:#4f80c0; --lean:#2f4f78; }
  }
  * { box-sizing:border-box }
  body { margin:0; font:14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background:var(--bg); color:var(--ink) }
  header { padding:20px 24px 8px }
  h1 { font-size:22px; margin:0 } .sub { color:var(--muted); margin-top:2px }
  .filters { display:flex; flex-wrap:wrap; gap:12px 16px; align-items:end; padding:12px 24px;
             border-bottom:1px solid var(--line) }
  label { display:flex; flex-direction:column; font-size:12px; color:var(--muted); gap:4px }
  input, select { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px;
                  background:var(--card); color:var(--ink) }
  .check { flex-direction:row; align-items:center; gap:6px; color:var(--ink); font-size:14px; padding-bottom:6px }
  .tabs { display:flex; gap:4px; padding:12px 24px 0 }
  .tabs button { font:inherit; border:1px solid var(--line); border-bottom:none; background:transparent;
                 color:var(--muted); padding:8px 14px; border-radius:8px 8px 0 0; cursor:pointer }
  .tabs button.on { background:var(--card); color:var(--ink); font-weight:600 }
  main { padding:0 24px 40px }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:0 8px 8px 8px; padding:16px; overflow-x:auto }
  table { border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums }
  th, td { padding:6px 8px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap }
  th { font-size:12px; color:var(--muted); font-weight:600; position:sticky; top:0; background:var(--card); cursor:pointer }
  th.l, td.l { text-align:left }
  .grp { border-left:1px solid var(--line) }
  .tier { display:inline-block; padding:1px 7px; border-radius:10px; font-size:11px; font-weight:600 }
  .STRONG { background:var(--strong); color:#fff } .MEDIUM { background:var(--medium); color:#fff }
  .LEAN { background:var(--lean); color:var(--ink) }
  .W { color:var(--win); font-weight:600 } .L { color:var(--loss); font-weight:600 } .P { color:var(--muted) }
  .muted { color:var(--muted) } h2 { font-size:16px; margin:20px 0 8px } h2:first-child { margin-top:0 }
  .note { color:var(--muted); font-size:12px; margin:4px 0 10px }
  svg text { fill:var(--muted); font-size:11px }
  .legend { display:flex; flex-wrap:wrap; gap:14px; font-size:12px; color:var(--muted); margin-top:6px }
  /* filters toggle (shown on phones) */
  .ftoggle { display:none }
  /* game cards (phones) */
  .cards { display:flex; flex-direction:column; gap:10px }
  .card { border:1px solid var(--line); border-radius:10px; padding:12px; background:var(--card) }
  .card .top { display:flex; justify-content:space-between; gap:8px; align-items:baseline }
  .card .teams { font-weight:600; font-size:15px }
  .card .meta { color:var(--muted); font-size:12px; white-space:nowrap }
  .card .flags { display:flex; flex-wrap:wrap; gap:6px 12px; margin:8px 0 6px; font-size:13px }
  .card .grid { display:grid; grid-template-columns:auto repeat(3, 1fr); gap:2px 10px; font-size:13px;
                font-variant-numeric:tabular-nums; text-align:right }
  .card .grid .h { color:var(--muted); font-size:11px }
  .card .grid .l { text-align:left; color:var(--muted) }
  @media (max-width: 700px) {
    header { padding:calc(12px + env(safe-area-inset-top)) 16px 6px }
    h1 { font-size:19px }
    .ftoggle { display:block; margin:8px 16px 0; font:inherit; font-size:15px; padding:10px 14px; width:calc(100% - 32px);
               border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); text-align:left }
    .filters { display:none; padding:12px 16px; border-bottom:none }
    .filters.open { display:grid; grid-template-columns:1fr 1fr; gap:10px }
    .filters label:not(.check) { min-width:0 }
    .filters .check { grid-column:1 / -1; min-height:44px; padding:0 }
    input, select { font-size:16px; min-height:44px; width:100% }   /* 16px stops iPhone zoom-on-tap */
    input[type=checkbox] { width:22px; height:22px; min-height:0 }
    .tabs { padding:12px 16px 0; position:sticky; top:0; background:var(--bg); z-index:2 }
    .tabs button { flex:1; padding:11px 6px; font-size:14px }
    main { padding:0 12px calc(24px + env(safe-area-inset-bottom)) }
    .panel { padding:12px; border-radius:0 0 10px 10px }
    .panel > table, .wrap { display:block; overflow-x:auto; -webkit-overflow-scrolling:touch }
    th { position:static }
    .hide-sm { display:none }
    svg text { font-size:13px }
  }
  .legend span::before { content:""; display:inline-block; width:12px; height:3px; margin-right:5px;
                         vertical-align:middle; background:var(--c) }
</style>
</head>
<body>
<header>
  <h1>NCAA men's basketball model</h1>
  <div class="sub" id="updated">Loading…</div>
</header>

<button class="ftoggle" id="ftoggle" aria-expanded="false">Filters ▾</button>
<div class="filters" id="filterbox">
  <label>From <input type="date" id="from"></label>
  <label>To <input type="date" id="to"></label>
  <label>Games <select id="status"><option>All</option><option>Upcoming</option><option>Final</option></select></label>
  <label>Team <input type="search" id="team" placeholder="e.g. Duke"></label>
  <label>Conference <select id="conf"><option value="">All</option></select></label>
  <label>Tier <select id="tier"><option value="">Any</option><option>STRONG</option><option>MEDIUM</option><option>LEAN</option></select></label>
  <label class="check"><input type="checkbox" id="flagged" checked> Flagged games only</label>
</div>

<nav class="tabs">
  <button data-tab="games" class="on">Games</button>
  <button data-tab="perf">Performance</button>
  <button data-tab="teams">Team ratings</button>
</nav>
<main><div class="panel" id="panel"></div></main>

<script src="app.js"></script>
</body>
</html>
